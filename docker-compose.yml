services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: qdrant
    ports:
      - "6333:6333" # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data: # Docker-managed; inspect with `docker volume inspect`
