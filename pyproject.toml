[project]
name = "rag-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-openrouter>=0.3.0",
    "langgraph>=1.2.24",
    "nltk>=3.10.0",
    "openai>=2.46.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "cli"]
addopts = "-q"
filterwarnings = [
    # qdrant-client's in-memory mode (used in unit tests) ignores these by design
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    "ignore:Local mode performs exact:UserWarning",
]
